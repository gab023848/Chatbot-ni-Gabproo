<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gab Chatbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <div class="brand-text">
          <span class="brand-name">Nemotron ni Gab</span>
          <span class="brand-sub">NVIDIA / 3-ultra-550b-a55b</span>
        </div>
      </div>
      <div class="topbar-actions">
        <nav class="topbar-nav" aria-label="Primary navigation">
          <a class="nav-link active" href="index.html">Chat</a>
          <a class="nav-link" href="about.html">About</a>
        </nav>
        <div class="status" id="status">
          <span class="status-dot"></span>
          <span id="status-text">Online Siguro??</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
          <span class="theme-toggle-icon">☀️</span>
        </button>
      </div>
    </header>

    <main class="log" id="log">
      <div class="empty-state" id="empty-state">
        <div class="hero-card">
          <h1>Ask anything brooo</h1>
          <p>Write a prompt, or try one of these starter ideas.</p>
        </div>
        <div class="prompt-row" id="prompt-row">
          <button class="prompt-chip" data-prompt="Make this sound more natural and human.">Make it human</button>
          <button class="prompt-chip" data-prompt="Summarize this in a simple and clear way.">Summarize it</button>
          <button class="prompt-chip" data-prompt="Turn this into a polished professional response.">Polish it</button>
          <button class="prompt-chip" data-prompt="Explain this step by step like I'm a beginner.">Explain it simply</button>
          <button class="prompt-chip" data-prompt="Help me write a creative and engaging answer.">Write creatively</button>
        </div>
      </div>
    </main>

    <form class="composer" id="composer">
      <textarea
        id="input"
        placeholder="Ask me anything…"
        rows="1"
        autocomplete="off"
      ></textarea>
      <div class="composer-actions">
        <label class="icon-btn" for="file-input" title="Upload a file">📎</label>
        <input id="file-input" type="file" hidden />
        <button type="submit" id="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div id="file-preview" class="file-preview hidden"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
